{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record what you spent</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-field">
                        <span class="amount-prefix" aria-hidden="true">₹</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input amount-input" placeholder="0.00"
                               step="0.01" min="0.01" inputmode="decimal"
                               value="{{ form.amount or '' }}" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {{ "selected" if not form.category }}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}" {{ "selected" if form.category == category }}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ form.date or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Dinner out"
                           maxlength="200" value="{{ form.description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile_transactions') }}">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
