<nav class="profile-subnav" aria-label="Profile sections">
    {% set range_args = {'from': date_from|default(none), 'to': date_to|default(none)} %}
    {% for endpoint, label in [
        ('profile', 'Profile'),
        ('profile_transactions', 'Transactions'),
        ('profile_summary', 'Summary'),
        ('profile_categories', 'Categories'),
    ] %}
    <a href="{{ url_for(endpoint, **range_args) }}"{% if request.endpoint == endpoint %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>
